<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="HALO placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101012"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#7EE7A3" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#B6F5CC" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#B6F5CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="82%" cy="88%" r="65%">
      <stop offset="0%" stop-color="#B6F5CC" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#B6F5CC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#EDEAE4" stroke-opacity="0.055"/>
    </pattern>
    <filter id="soft"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <rect width="1000" height="625" fill="url(#bg)"/>
  <rect width="1000" height="625" fill="url(#grid)"/>
  <rect width="1000" height="625" fill="url(#glow)"/>
  <rect width="1000" height="625" fill="url(#glow2)"/>

  <g filter="url(#soft)" opacity="0.55">
    <rect x="-80" y="140" width="420" height="420" rx="80" fill="#7EE7A3" opacity="0.32"/>
  </g>

  <g><circle cx="44.4" cy="50.0" r="1.8" fill="#EDEAE4" opacity="0.10"/><circle cx="59.2" cy="15.2" r="3.5" fill="#EDEAE4" opacity="0.17"/><circle cx="74.0" cy="36.4" r="2.2" fill="#EDEAE4" opacity="0.24"/><circle cx="88.8" cy="1.6" r="3.9" fill="#EDEAE4" opacity="0.31"/><circle cx="3.6" cy="22.8" r="2.6" fill="#EDEAE4" opacity="0.38"/><circle cx="18.4" cy="44.0" r="1.3" fill="#EDEAE4" opacity="0.10"/><circle cx="33.2" cy="9.2" r="3.0" fill="#EDEAE4" opacity="0.17"/><circle cx="48.0" cy="30.4" r="1.7" fill="#EDEAE4" opacity="0.24"/><circle cx="62.8" cy="51.6" r="3.4" fill="#EDEAE4" opacity="0.31"/><circle cx="77.6" cy="16.8" r="2.1" fill="#EDEAE4" opacity="0.38"/><circle cx="92.4" cy="38.0" r="3.8" fill="#EDEAE4" opacity="0.10"/><circle cx="7.2" cy="3.2" r="2.5" fill="#EDEAE4" opacity="0.17"/><circle cx="22.0" cy="24.4" r="1.2" fill="#EDEAE4" opacity="0.24"/><circle cx="36.8" cy="45.6" r="2.9" fill="#EDEAE4" opacity="0.31"/><circle cx="51.6" cy="10.8" r="1.6" fill="#EDEAE4" opacity="0.38"/><circle cx="66.4" cy="32.0" r="3.3" fill="#EDEAE4" opacity="0.10"/><circle cx="81.2" cy="53.2" r="2.0" fill="#EDEAE4" opacity="0.17"/><circle cx="96.0" cy="18.4" r="3.7" fill="#EDEAE4" opacity="0.24"/><circle cx="10.8" cy="39.6" r="2.4" fill="#EDEAE4" opacity="0.31"/><circle cx="25.6" cy="4.8" r="1.1" fill="#EDEAE4" opacity="0.38"/><circle cx="40.4" cy="26.0" r="2.8" fill="#EDEAE4" opacity="0.10"/><circle cx="55.2" cy="47.2" r="1.5" fill="#EDEAE4" opacity="0.17"/><circle cx="70.0" cy="12.4" r="3.2" fill="#EDEAE4" opacity="0.24"/><circle cx="84.8" cy="33.6" r="1.9" fill="#EDEAE4" opacity="0.31"/><circle cx="99.6" cy="54.8" r="3.6" fill="#EDEAE4" opacity="0.38"/><circle cx="14.4" cy="20.0" r="2.3" fill="#EDEAE4" opacity="0.10"/></g>

  <!-- A ribbon suggesting motion / data -->
  <path d="M-40 430 C 220 300, 520 560, 1040 330"
        fill="none" stroke="#7EE7A3" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M-40 470 C 240 350, 540 600, 1040 380"
        fill="none" stroke="#B6F5CC" stroke-opacity="0.35" stroke-width="1.2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="56" y="86" fill="#B6F5CC" font-size="15" letter-spacing="5">01 / 03</text>
    <text x="56" y="527" fill="#EDEAE4" font-size="60" font-weight="600" letter-spacing="-1.5">HALO</text>
    <text x="56" y="565" fill="#EDEAE4" fill-opacity="0.55" font-size="17" letter-spacing="3">EDGE STOREFRONT</text>
  </g>

  <rect x="0.5" y="0.5" width="999" height="624" fill="none" stroke="#7EE7A3" stroke-opacity="0.25"/>

  <!-- Watermark so nobody mistakes a placeholder for finished work -->
