  <path d="M-40 350 C 220 380, 520 460, 1040 390"
        fill="none" stroke="#7EE7A3" stroke-opacity="0.75" stroke-width="2"/>
  <path d="M-40 390 C 240 430, 540 500, 1040 440"
        fill="none" stroke="#B6F5CC" stroke-opacity="0.35" stroke-width="1.2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="56" y="86" fill="#B6F5CC" font-size="15" letter-spacing="5">03 / 03</text>
