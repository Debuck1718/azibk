<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-label="FLUX ENGINE placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#101012"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#FF7A59" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#FFB59E" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFB59E" stop-opacity="0"/>
