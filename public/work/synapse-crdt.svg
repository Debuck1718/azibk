      <stop offset="0%" stop-color="#101012"/>
      <stop offset="100%" stop-color="#0A0A0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.60"/>
      <stop offset="55%" stop-color="#E0C3FE" stop-opacity="0.14"/>
